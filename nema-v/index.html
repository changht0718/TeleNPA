<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NEMA-V｜場景記憶與重建（研究原型）</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#19334a;background:#eff4f7}*{box-sizing:border-box}body{margin:0}header{background:#193a54;color:white;padding:18px max(18px,calc((100vw - 1060px)/2));}header h1{font-size:23px;margin:0 0 5px}header small{opacity:.85}main{max-width:1060px;padding:22px 18px 45px;margin:auto}.card{background:white;padding:24px;border:1px solid #d7e2e9;border-radius:16px;margin:0 0 18px;box-shadow:0 2px 7px #17354b08}h2{font-size:22px;margin:0 0 12px}p{line-height:1.7;margin:8px 0}.minor{color:#5c7485;font-size:14px}.notice{background:#f6f1e4;padding:12px 14px;border-radius:10px;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button{background:#18659c;color:white;border:0;border-radius:10px;padding:12px 17px;font-size:16px;font-weight:600;cursor:pointer}button.alt{background:#e5eef4;color:#24435b}button:disabled{opacity:.43;cursor:not-allowed}.progress{font-size:14px;color:#577084;margin-bottom:9px}#scene{position:relative;aspect-ratio:4/3;max-width:760px;overflow:hidden;border-radius:13px;border:2px solid #a4b9c6;margin:12px auto;background:#ddd;touch-action:none;user-select:none}.scene-layer{position:absolute;inset:0;transform-origin:center center}.env{position:absolute;inset:0;overflow:hidden}.env::before,.env::after{content:"";position:absolute;pointer-events:none}.env.kitchen{background:linear-gradient(#dfd6c7 0 61%,#b49a83 61% 100%)}.env.kitchen:before{left:4%;top:9%;width:27%;height:40%;border:11px solid #c7b297;background:linear-gradient(135deg,#a9cfce,#e5f1ee);box-shadow:280px 8px 0 -10px #e9ded0}.env.kitchen:after{left:9%;right:8%;top:60%;height:5%;background:#7a5e4a;box-shadow:0 9px #997b62}.env.study{background:linear-gradient(#d7e0da 0 61%,#b4a18e 61% 100%)}.env.study:before{left:7%;top:8%;width:28%;height:41%;border:9px solid #789198;background:#b7d6dd}.env.study:after{left:9%;right:7%;top:63%;height:6%;background:#a67c55;box-shadow:0 15px #765c4a}.env.entry{background:linear-gradient(90deg,#ddd9d1 0 73%,#9f7e64 73% 100%)}.env.entry:before{left:12%;top:12%;width:44%;height:12%;background:#987b60;box-shadow:0 8px #80664f}.env.entry:after{left:6%;right:8%;top:76%;height:9%;background:#a38160;box-shadow:0 17px #775d48}.env.flowers{background:linear-gradient(#c0d4bf 0 63%,#b69476 63% 100%)}.env.flowers:before{inset:3% 3% 36%;background:radial-gradient(circle at 18% 58%,#5e8a64 0 8%,transparent 9%),radial-gradient(circle at 82% 27%,#6c956b 0 13%,transparent 14%);opacity:.6}.env.flowers:after{left:5%;right:5%;top:63%;height:7%;background:#a27958;box-shadow:0 17px #81583e}.env[class*=trad]{background:linear-gradient(#98734e 0 63%,#76593c 63% 100%)}.env[class*=trad]:before{inset:0;background:repeating-linear-gradient(90deg,transparent 0 9%,#553c2c35 9.2% 9.7%,transparent 10% 18%);}.env[class*=trad]:after{left:6%;right:6%;top:61%;height:7%;background:#ab8962;box-shadow:0 14px #604a39}.env.tradflowers{background:linear-gradient(#79916a 0 52%,#7d7453 52% 100%)}.env.tradflowers:before{inset:0;background:radial-gradient(circle at 8% 32%,#3c6946 0 18%,transparent 19%),radial-gradient(circle at 88% 24%,#426e43 0 19%,transparent 20%)}.env.tradflowers:after{left:5%;right:5%;top:66%;height:6%;background:#735638}.theme1{filter:hue-rotate(7deg) brightness(1.06)}.theme2{filter:hue-rotate(-14deg) saturate(.85)}.theme3{filter:sepia(.18) contrast(1.06)}.item{position:absolute;display:grid;place-items:center;transform:translate(-50%,-50%);font-size:clamp(25px,5vw,54px);height:14%;width:15%;filter:drop-shadow(2px 4px 2px #3e30254a);z-index:2}.item img{width:100%}.target{cursor:grab;touch-action:none}.target.active{outline:3px dashed #155789;border-radius:10px;background:#faf7ea70}.site{position:absolute;border:1px dashed transparent;border-radius:11px;transform:translate(-50%,-50%);width:16%;height:19%;z-index:1}.placing .site{border-color:#3c607142;background:#ffffff0d}.placing .site:active{background:#ffffff46}.tray{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:12px}.tile{touch-action:none;padding:9px 13px;border:2px solid #b2c7d3;border-radius:12px;font-size:30px;background:#f6f9fb;color:#123b56;min-width:65px}.tile.selected{border-color:#1c6f9d;background:#d7eaf6}.tile.used{opacity:.45}.choicegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.option{border:2px solid #cedbe3;background:#fafcfd;border-radius:12px;padding:9px;color:#263c4c;text-align:left}.option.selected{border-color:#137ca9;background:#e6f4fb}.thumb{height:140px;border-radius:8px;position:relative;overflow:hidden;background:#ddd}.thumb .env{transform:scale(1.0)}.thumb .item{font-size:26px}.thumb .scene-layer{transform-origin:center}.optionlabel{font-size:13px;margin:5px 0 0;text-align:center;color:#4b6477}.bgchoices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.bgchoices .thumb{height:120px}.sliderwrap{max-width:680px;margin:16px auto}.sliderlabels{display:flex;justify-content:space-between;color:#43627a;font-size:16px;font-weight:600}.sliderwrap input{width:100%;height:35px;accent-color:#246e9d;touch-action:pan-x}.hidden{display:none!important}.summary{font-size:14px;background:#eef5fa;border-radius:10px;padding:14px;white-space:pre-wrap;word-break:break-word}.stepname{font-size:15px;font-weight:700;color:#27638a}footer{font-size:12px;color:#6b7c87;margin-top:24px}@media(min-width:790px){.choicegrid{grid-template-columns:repeat(3,minmax(0,1fr))}.bgchoices{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:500px){.card{padding:15px}.item{font-size:33px}.thumb .item{font-size:18px}.thumb{height:110px}}
</style></head><body><header><h1>NEMA-V｜場景記憶與重建</h1><small>Scene Memory, Boundary Reconstruction & Relational Recognition｜TeleNPA 雙階段測試版</small></header><main><div id="app"></div><footer>此版本為互動介面與資料結構原型：場景使用示意插畫／圖示，並非已驗證或文化審查的正式刺激；測試版資料同步至 Supabase；刺激尚未正式驗證或文化審查，不用於臨床計分。</footer></main><script src="../config.js"></script><script src="../shared/auth.js"></script><script>
'use strict';
const scenes=[
{id:'M1',kind:'kitchen',label:'現代廚房',cultural:'modern',objs:['🍎','🍪','☕','🧽','🫖','🪵']},
{id:'T1',kind:'tradkitchen',label:'傳統備食區',cultural:'traditional',objs:['🪨','🪵','🧺','🌾','🍲','🏺']},
{id:'M2',kind:'study',label:'書桌',cultural:'modern',objs:['💡','✏️','🪴','📁','📓','👓']},
{id:'T2',kind:'tradstudy',label:'編織工作區',cultural:'traditional',objs:['🪡','🧶','🧺','🪢','🧣','🧰']},
{id:'M3',kind:'entry',label:'都市玄關',cultural:'modern',objs:['👒','🧥','🎒','🍼','☂️','🧺']},
{id:'T3',kind:'tradentry',label:'山屋入口',cultural:'traditional',objs:['🧺','🧣','🦯','🩴','🏺','🥣']},
{id:'M4',kind:'flowers',label:'社區花市',cultural:'modern',objs:['🪴','🚿','✂️','🧤','👒','🛍️']},
{id:'T4',kind:'tradflowers',label:'採集整理區',cultural:'traditional',objs:['🧺','🌿','🥣','🏺','🔪','👜']}
];
// Slot center coordinates in percent. Hidden 4 × 3 snap locations; 6 are occupied in each scene.
const slots=[{x:14,y:22},{x:38,y:22},{x:63,y:23},{x:86,y:23},{x:15,y:51},{x:39,y:51},{x:62,y:51},{x:86,y:51},{x:14,y:79},{x:38,y:79},{x:62,y:79},{x:86,y:79}];
const configs=[[0,3,5,6,9,11],[1,2,4,7,8,10],[0,2,5,7,9,11],[1,3,4,6,8,10]];
const $=id=>document.getElementById(id);const shuffle=a=>{let c=[...a];for(let i=c.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c};
const clone=x=>JSON.parse(JSON.stringify(x));const now=()=>new Date().toISOString();
let state={phase:'intro',order:[],idx:0,seen:[],runs:[],started:now(),current:null,selectedObj:null,answers:{},zoom:1,background:null,recognition:null};
const app=$('app');
function set(html){app.innerHTML=html;window.scrollTo({top:0,behavior:'instant'});}function box(title,inner){return `<section class="card"><h2>${title}</h2>${inner}</section>`}
function bkg(kind,theme=0){return `<div class="env ${kind} ${theme?'theme'+theme:''}"></div>`}
function itemsHtml(sc,locs,customObjects=sc.objs){return customObjects.map((o,i)=>{if(locs[i]===null||locs[i]===undefined)return '';const p=slots[locs[i]];return `<span class="item" data-index="${i}" style="left:${p.x}%;top:${p.y}%">${o}</span>`}).join('')}
function sceneHtml(sc,locs,zoom=1,opts={}){return `<div class="scene-layer" style="transform:scale(${1/zoom}) ${opts.rotate?'rotate('+opts.rotate+'deg)':''}">${bkg(sc.kind,opts.theme||0)}${itemsHtml(sc,locs,opts.objects||sc.objs)}</div>`}
function layout(id){let sc=scenes.find(s=>s.id===id);let k=parseInt(id.substring(1))-1;return {...sc,locs:configs[k].slice(),zoom:([.85,1.12,.93,1.09])[k]}}
function initial(){state.phase='intro';set(box('NEMA-V｜試測流程',`<p>四個場景會以隨機順序呈現（每類功能場景選取一個版本，總計一般生活與傳統生活各兩個）。接著依序完成背景辨識、場景邊界調整、六物件位置重建，以及五選一整體再認。</p><p class="notice">這是可操作的原型：每一階段都<strong>不會提示正確答案</strong>。滑桿只有「較近／較遠」，不顯示數字。拖曳物件會吸附到隱形格位，也可先點選物件再點選場景位置。</p><div class="actions"><button onclick="start()">開始新場次</button></div>`));}
async function start(){if(busy)return;busy=true;let m=Math.random()<.5?0:1;state.order=[0,1,2,3].map((i)=>layout((i%2===m?'M':'T')+(i+1)));state.order=shuffle(state.order);state.seen=[];state.runs=[];state.idx=0;state.started=now();try{phaseMode='immediate';immediateEnd=null;await initAssessment();encode()}catch(e){alert('無法建立 Supabase 場次：'+e.message);initial()}finally{busy=false}}
function encode(){state.phase='encode';persist();if(state.idx>=state.order.length){state.idx=0;return beginRecall()}const sc=state.order[state.idx];state.current=sc;state.seen.push({id:sc.id,at:now()});set(box(`編碼｜畫面 ${state.idx+1}／${state.order.length}`,`<p class="minor">請記住畫面中的<strong>背景、六項物件及各物件的位置</strong>。觀察完成後按下一步。</p><div id="scene">${sceneHtml(sc,sc.locs,sc.zoom)}</div><div class="actions"><button onclick="state.idx++;encode()">已記住，下一張</button></div>`));}
function beginRecall(){state.idx=0;recallScene()}
function recallScene(){state.phase='background';if(state.idx>=state.order.length)return completePhase();let sc=state.order[state.idx];state.current=sc;state.answers={id:sc.id,phase:phaseMode,encZoom:sc.zoom,encLocs:sc.locs,started_at:now()};state.background=null;state.zoom=1;state.selectedObj=null;state.recognition=null;persist();renderBg()}
function renderBg(){const sc=state.current;let variants=shuffle([0,1,2,3]);state.bgVariants=variants;set(box(`重建 ${state.idx+1}／${state.order.length}｜背景辨識`,`<p>四種風格相近的背景中，請選擇剛才看到的那一個。只需要點一下。</p><div class="bgchoices">${variants.map((v,i)=>`<button class="option" id="bg${i}" onclick="pickBg(${i},${v})"><div class="thumb">${bkg(sc.kind,v)}</div><div class="optionlabel">選項 ${'ABCD'[i]}</div></button>`).join('')}</div><div class="actions"><button id="next" disabled onclick="goZoom()">下一步：調整場景遠近</button></div>`));}
function pickBg(i,v){state.background=v;state.answers.background_choice=v;state.answers.background_at=now();persist();document.querySelectorAll('.bgchoices .option').forEach((b,j)=>b.classList.toggle('selected',i===j));$('next').disabled=false;}
function goZoom(){state.phase='zoom';state.zoom=.73+Math.random()*.54;renderZoom();}
function renderZoom(){let sc=state.current;set(box(`重建 ${state.idx+1}／${state.order.length}｜場景邊界`,`<p>請調整畫面的遠近，直到它看起來與剛才記住的視野範圍相同。</p><div id="scene">${sceneHtml(sc,Array(6).fill(null),state.zoom,{theme:state.background})}</div><div class="sliderwrap"><div class="sliderlabels"><span>較近</span><span>較遠</span></div><input id="zoomslider" type="range" min="0.65" max="1.35" step="0.005" value="${state.zoom}" oninput="changeZoom(this.value)" aria-label="場景較近或較遠"></div><p class="minor">請依記憶調整，畫面不會顯示比例或正確答案。</p><div class="actions"><button onclick="goPlace()">下一步：重建物件位置</button></div>`));}
function changeZoom(x){state.zoom=Number(x);persist();let layer=document.querySelector('#scene .scene-layer');if(layer)layer.style.transform=`scale(${1/state.zoom})`;}
function goPlace(){state.phase='place';state.answers.zoom=state.zoom;state.answers.zoom_at=now();state.places=Array(6).fill(null);state.selectedObj=0;renderPlace();}
function renderPlace(){let sc=state.current;set(box(`重建 ${state.idx+1}／${state.order.length}｜物件位置`,`<p>請將下方六項物件放回你記得的位置。<strong>拖曳物件到畫面上</strong>，或先點下方物件，再點一下畫面位置。系統會自動吸附到隱藏格位。</p><div id="scene" class="placing">${sceneHtml(sc,state.places,state.zoom,{theme:state.background})}<div id="slotLayer" class="scene-layer" style="transform:scale(${1/state.zoom})">${slots.map((p,i)=>`<div class="site" data-slot="${i}" style="left:${p.x}%;top:${p.y}%"></div>`).join('')}</div></div><div class="tray">${sc.objs.map((o,i)=>`<button class="tile ${state.selectedObj===i?'selected':''} ${state.places[i]!==null?'used':''}" data-object="${i}" aria-label="第${i+1}個物件" title="點選後再點圖片">${o}</button>`).join('')}</div><div class="actions"><button id="placeNext" ${state.places.some(p=>p===null)?'disabled':''} onclick="goRecognize()">完成位置重建，進行五選一再認</button><button class="alt" onclick="state.places=Array(6).fill(null);state.selectedObj=0;renderPlace()">清除重放</button></div>`));setupPlace()}
function nearest(x,y){let res=0,dist=Infinity;slots.forEach((s,i)=>{let d=(s.x-x)**2+(s.y-y)**2;if(d<dist){dist=d;res=i}});return res}
function addAt(idx,slot){if(idx===null)return;let other=state.places.indexOf(slot);if(other>=0&&other!==idx)state.places[other]=state.places[idx];state.places[idx]=slot;state.selectedObj=state.places.findIndex(x=>x===null);if(state.selectedObj<0)state.selectedObj=null;persist();renderPlace()}
function setupPlace(){document.querySelectorAll('.tile').forEach(b=>{b.addEventListener('click',()=>{state.selectedObj=Number(b.dataset.object);document.querySelectorAll('.tile').forEach(c=>c.classList.toggle('selected',c===b))});b.addEventListener('pointerdown',e=>{window.dragIdx=Number(b.dataset.object);window.dragStart={x:e.clientX,y:e.clientY}})});let stage=$('scene'); stage.addEventListener('pointerup',e=>{if(window.dragIdx!==null&&window.dragIdx!==undefined)return;const r=stage.getBoundingClientRect();let x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;x=(x-50)*state.zoom+50;y=(y-50)*state.zoom+50;addAt(state.selectedObj,nearest(x,y));});}
window.addEventListener('pointerup',e=>{if(window.dragIdx===null||window.dragIdx===undefined)return;let idx=window.dragIdx;window.dragIdx=null;if(state.phase!=='place')return;let stage=$('scene');if(!stage)return;let r=stage.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return;let x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;x=(x-50)*state.zoom+50;y=(y-50)*state.zoom+50;addAt(idx,nearest(x,y));});
function getCandidates(sc){let alt=clone(sc.locs);[alt[1],alt[4]]=[alt[4],alt[1]];let o=clone(sc.objs);let substitutes=['🍐','🧸','⌚','🎒','📦','🔔','🥕','🪣'];o[2]=substitutes[sc.id.charCodeAt(0)+sc.id.charCodeAt(1)>>>0&7];if(o[2]===sc.objs[2])o[2]='🎲';let options=[{type:'target',locs:sc.locs,kind:sc.kind,zoom:sc.zoom,objects:sc.objs,theme:0,angle:0},{type:'background',locs:sc.locs,kind:sc.kind,zoom:sc.zoom,objects:sc.objs,theme:2,angle:0},{type:'location',locs:alt,kind:sc.kind,zoom:sc.zoom,objects:sc.objs,theme:0,angle:0},{type:'object',locs:sc.locs,kind:sc.kind,zoom:sc.zoom,objects:o,theme:0,angle:0},{type:'viewpoint',locs:sc.locs,kind:sc.kind,zoom:sc.zoom,objects:sc.objs,theme:0,angle:8}];return shuffle(options)}
function goRecognize(){state.phase='recognize';state.answers.locations=clone(state.places);state.answers.place_at=now();state.candidates=getCandidates(state.current);renderRecognize()}
function renderRecognize(){let sc=state.current;set(box(`重建 ${state.idx+1}／${state.order.length}｜整體再認`,`<p>請在五張圖片中選出與最初看到的場景<strong>完全相同</strong>的一張。選項的排列位置已隨機化。</p><div class="choicegrid">${state.candidates.map((c,i)=>`<button class="option" id="rec${i}" onclick="chooseRec(${i})"><div class="thumb"><div class="scene-layer" style="transform:scale(${1/c.zoom}) rotate(${c.angle||0}deg)">${bkg(c.kind,c.theme)}${itemsHtml(sc,c.locs,c.objects)}</div></div><div class="optionlabel">選項 ${'ABCDE'[i]}</div></button>`).join('')}</div><div class="actions"><button id="recNext" disabled onclick="saveTrial()">儲存本題並繼續</button></div><p class="minor">請注意：此原型的誘餌為示意，正式研究所需的背景、物件外觀及鏡頭視角差異尚未完成刺激等值化。</p>`));}
function chooseRec(i){state.recognition=i;document.querySelectorAll('.choicegrid .option').forEach((b,j)=>b.classList.toggle('selected',i===j));$('recNext').disabled=false}
async function saveTrial(){if(busy)return;busy=true;let c=state.candidates[state.recognition];state.answers.recognition_choice=state.recognition;state.answers.recognition_type=c.type;state.answers.recognition_correct=c.type==='target';state.answers.recognition_at=now();state.answers.completed_at=now();try{await syncTrial(clone(state.answers),state.idx);state.runs.push(clone(state.answers));state.idx++;persist();recallScene()}catch(e){alert('雲端同步未成功，請確認網路並再次按儲存：'+e.message)}finally{busy=false}}

async function completePhase(){if(phaseMode==='immediate'){
 try{immediateEnd=await serverComplete();persist();await syncRun('immediate');showWaiting();const q=protocol()?.steps||[];const i=q.indexOf('nemav:immediate'),j=q.indexOf('nemav:delayed');if(i>=0&&j>i&&q.slice(i+1,j).includes('nvcst'))startIntervening()}
 catch(e){set(box('無法完成 NEMA-V-I',`<p>雲端儲存有問題：${e.message}。請檢查網路與 Supabase，勿清除本機進度。</p><button onclick="completePhase()">重試完成確認</button>`))}
 }else{try{await syncRun('delayed');phaseMode='finished';state.phase='done';persist();finish()}catch(e){set(box('雲端同步未完成',`<p>${e.message}</p><button onclick="completePhase()">重試同步</button>`))}}}
function finish(){state.phase='done';let summary=state.runs.map((r,i)=>`第 ${i+1} 題（${r.id}）｜背景：${r.background_choice===0?'正確':'其他'}；六物件位置：${r.locations.filter((v,j)=>v===r.encLocs[j]).length}/6；再認：${r.recognition_correct?'正確':r.recognition_type}`).join('\n');set(box('模擬施測完成',`<p>四個場景已完成延宕重建，且每題已寫入 Supabase。可將本次測試資料下載成 JSON，檢查每個步驟的反應、時間戳與位置格位。</p><div class="summary">${summary}</div><div class="actions"><button onclick="exportData()">下載測試結果 JSON</button><button class="alt" onclick="resetAssessment()">建立另一個測試場次</button></div><p class="notice">此版具備伺服器時間控制與 Supabase 資料同步；但仍是尚未完成刺激、常模及臨床效度驗證的研究原型。</p>`));}
function resetAssessment(){if(confirm('建立新場次會清除本裝置上的 NEMA-V 本機進度，請先匯出並確認 Supabase 資料完整。繼續嗎？')){localStorage.removeItem(PERSIST);assessment=null;immediateEnd=null;phaseMode='immediate';initial()}}
function exportData(){let data={tool:'NEMA-V prototype',version:'0.1',started:state.started,assessment_id:assessment,phase:phaseMode,exported:now(),runs:state.runs,notes:'Research prototype; cloud copy in nemav_sessions, nemav_trials and test_runs; not clinically validated.'};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='NEMA_V_demo_'+new Date().toISOString().replaceAll(':','-')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
// TeleNPA cloud integration and 25-minute delayed recall. Active account/battery required.
const A=window.TeleNPAAuth;
const PERSIST='telenpa_nemav_progress_v1';
const activeBattery=()=>{try{return JSON.parse(localStorage.getItem('telenpa_battery_active_v2')||'null')}catch{return null}};
const protocol=()=>{try{return JSON.parse(localStorage.getItem('telenpa_protocol_builder_v3')||'null')}catch{return null}};
let assessment=null, immediateEnd=null, phaseMode='immediate', clinicalSync=false, busy=false;
const persist=()=>{if(assessment)localStorage.setItem(PERSIST,JSON.stringify({assessment,immediateEnd,phaseMode,state,owner:A.user()?.id,battery:activeBattery()?.id}))};
const cloud=async(path,opts={})=>A.request(path,opts);
async function insertRow(table,row){return cloud('/rest/v1/'+table,{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(row)})}
async function initAssessment(){
 const b=activeBattery();if(!A.user())throw Error('請先在首頁登入 Supabase');if(!b?.id)throw Error('請先在首頁選用受試者場次');
 assessment=crypto.randomUUID();
 await insertRow('nemav_sessions',{id:assessment,owner_id:A.user().id,battery_session_id:b.id,stimulus_order:state.order.map(x=>({scene_id:x.id,locations:x.locs,encoding_zoom:x.zoom})),stimulus_version:'prototype-v1'});
 persist();
}
async function syncTrial(r,index){
 const id=state.answers.cloud_id || crypto.randomUUID();
 state.answers.cloud_id=id;persist();
 await cloud('/rest/v1/nemav_trials?on_conflict=assessment_id,phase,trial_index',{
 method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},
 body:JSON.stringify({id,owner_id:A.user().id,assessment_id:assessment,phase:phaseMode,trial_index:index,scene_id:r.id,response:{...r,cloud_id:id}})});
}
async function syncRun(phase){
 state.runIds??={};state.runIds[phase]??=crypto.randomUUID();persist();
 await cloud('/rest/v1/test_runs?on_conflict=id',{
 method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},
 body:JSON.stringify({id:state.runIds[phase],owner_id:A.user().id,battery_session_id:activeBattery().id,
 test_id:'nemav',test_version:'prototype-v1',mode:'formal',condition:phase,status:'completed',
 started_at:phase==='immediate'?state.started:immediateEnd,ended_at:new Date().toISOString(),source_record_id:assessment})});
}

async function serverComplete(){
 const result=await cloud('/rest/v1/rpc/nemav_complete_immediate',{method:'POST',body:JSON.stringify({p_assessment_id:assessment})});
 if(typeof result!=='string')throw Error('雲端未回傳起始時間');return result;
}
function delayLeft(){if(!immediateEnd)return 25*60000;return Math.max(0,Date.parse(immediateEnd)+25*60000-Date.now())}
async function showWaiting(){
 phaseMode='waiting';state.phase='waiting';persist();
 const m=Math.ceil(delayLeft()/60000),sec=Math.ceil(delayLeft()/1000);
 set(box('NEMA-V-I 已完成｜等待 NEMA-V-II',`<p>四個場景的立即重建已同步成功。延宕時間從<strong>最後一題立即回憶完成並完成雲端確認</strong>開始，由 Supabase 伺服器時間記錄。</p><h2 id="remaining">${Math.floor(sec/60)} 分 ${String(sec%60).padStart(2,'0')} 秒</h2><p class="minor">至少 25 分鐘後才能啟動 NEMA-V-II。可以離開此頁完成其他排定測驗，再返回本頁。</p><div class="actions"><button id="checkDelay" onclick="tryDelayed()" ${sec>0?'disabled':''}>檢查並開始 NEMA-V-II</button><button class="alt" onclick="location.assign('../')">返回 TeleNPA 選單</button><button class="alt" onclick="startIntervening()">執行 NVCST（如已排定）</button></div><p class="minor" id="gateState">延宕時間由雲端紀錄把關，修改裝置時間不會提前解鎖。</p>`));
}
function startIntervening(){const proto=protocol();const steps=proto?.steps||[];const i=steps.indexOf('nemav:immediate'),j=steps.indexOf('nemav:delayed');if(i<0||j<=i||!steps.slice(i+1,j).includes('nvcst')){alert('所選順序在 NEMA-V-I 與 II 之間沒有安排 NVCST；請返回選單選擇其他測驗。');return}
 const conditions=proto?.parts?.nvcst||['motor','search','maintain','switch'];location.assign('../nvcst/?conditions='+encodeURIComponent(conditions.join(','))+'&return=nemav&nemav_id='+encodeURIComponent(assessment));}
async function tryDelayed(){if(delayLeft()>0){showWaiting();return}try{busy=true;const r=await cloud('/rest/v1/nemav_sessions?select=immediate_completed_at&id=eq.'+assessment);if(!r?.[0]?.immediate_completed_at)throw Error('找不到雲端起始時間');immediateEnd=r[0].immediate_completed_at;const ready=await cloud('/rest/v1/rpc/nemav_delayed_ready',{method:'POST',body:JSON.stringify({p_assessment_id:assessment})});if(ready!==true)throw Error('Supabase 伺服器尚未確認已達 25 分鐘');phaseMode='delayed';state.idx=0;state.runs=[];persist();beginRecall()}catch(e){const el=$('gateState');if(el)el.textContent='無法啟動：'+e.message}finally{busy=false}}
setInterval(()=>{if(phaseMode==='waiting'&&$('remaining')){const sec=Math.ceil(delayLeft()/1000);$('remaining').textContent=Math.floor(sec/60)+' 分 '+String(sec%60).padStart(2,'0')+' 秒';if($('checkDelay'))$('checkDelay').disabled=sec>0}},1000);
async function resumeOrStart(){await A.restore();const saved=localStorage.getItem(PERSIST);if(saved){try{const x=JSON.parse(saved);if(x.owner===A.user()?.id&&x.battery===activeBattery()?.id){assessment=x.assessment;immediateEnd=x.immediateEnd;phaseMode=x.phaseMode;state=x.state;if(phaseMode==='waiting')return showWaiting();if(phaseMode==='finished')return finish();if(phaseMode==='delayed'){if(state.phase==='background')return renderBg();return recallScene()}if(phaseMode==='immediate'){if(state.phase==='encode')return encode();if(state.phase==='background')return renderBg();return recallScene()} }}catch(e){console.warn(e)}}
 initial();
}
// Persist at meaningful stages; no cloud fallback that silently claims a successful save.
resumeOrStart().catch(e=>set(box('無法載入 NEMA-V',`<p>${e.message}</p><button onclick="location.assign('../')">返回首頁</button>`)));
</script></body></html>
