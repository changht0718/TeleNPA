/* Photo stimuli v2; no emoji or synthetic CSS backgrounds used for testing. */
.photo-stage{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none}
.photo-layer{position:absolute;inset:0;transform-origin:center;}
.item{width:12%;height:15%;font-size:inherit;filter:none;border:1px solid #d4dfe7;border-radius:8px;background:#f8fafb;overflow:hidden;box-shadow:0 2px 8px #0004}
.item img{width:100%;height:100%;object-fit:contain}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;min-width:94px;min-height:91px;gap:2px}
.tile img{height:60px;width:82px;object-fit:contain;border-radius:7px}
.site{width:5%;height:7%;display:none!important}
.placing .site{display:none!important}
.thumb{aspect-ratio:4/3;height:auto!important;max-height:220px;}
.thumb img{height:100%;width:100%;object-fit:cover}
.bgchoices .thumb{max-height:150px}
.option img{pointer-events:none}
.photo-note{padding:8px 12px;background:#f0f5f7;border-radius:8px;color:#526a7d;font-size:13px}

.asset-status{font-weight:600;border-radius:10px;padding:12px;margin:12px 0;background:#e8f3f8;color:#193a54}
.asset-status.error{background:#fff0ea;color:#963923;white-space:pre-wrap;overflow-wrap:anywhere}
.asset-status.ok{background:#e7f5ed;color:#225e3b}
button:disabled{opacity:.55;cursor:not-allowed}


/* NEMA-V v9 - no visible placement anchors; sprite layers share encoding geometry */
#scene.placing{touch-action:none;cursor:crosshair}
.placing .site,.site,[class~="placement-marker"],[class~="snap-point"]{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}

.placed-object img{width:100%;height:100%;object-fit:contain;pointer-events:none}

.object-card span{font-size:14px;font-weight:650}

.one-bg{max-width:610px;margin:12px auto}

/* NEMA-V v11: photo-realistic objects, consistent tray tiles, crisp sprites */
.object-tray{gap:10px}

/* v17: visually comparable object cards, 10 choices; no cueing target vs distractor */

.object-card{height:128px;min-height:128px;padding:7px;min-width:0}
.object-card img{width:105px;max-width:95%;height:86px;max-height:86px}

.object-card.used{opacity:.72}

@media(min-width:850px){.object-tray{grid-template-columns:repeat(5,minmax(0,1fr))}}
/* v19: standardized clean illustrations in palette and placed states */

.placed-object img{filter:none!important;image-rendering:auto}

function getCandidates(sc){return shuffle(['target','background','location','object'].map(type=>({type,img:type==='target'?sc.photo:`assets-v20/${sc.id}_${type}.webp`})))}
function goRecognize(){state.phase='recognize';state.answers.recognition_started_at??=now();state.candidates??=getCandidates(state.current);persist();renderRecognize()}
function renderRecognize(){let sc=state.current;set(box(`整體再認 ${state.idx+1}／${state.order.length}`,`<p>請在四張圖片中選出與最初看到的場景<strong>完全相同</strong>的一張，選項位置已隨機。</p><div class="choicegrid">${state.candidates.map((c,i)=>`<button class="option" id="rec${i}" onclick="chooseRec(${i})"><div class="thumb"><img src="${c.img}" alt="場景候選圖片"></div><div class="optionlabel">選項 ${'ABCD'[i]}</div></button>`).join('')}</div><div class="actions"><button id="recNext" disabled onclick="saveTrial()">儲存本題並繼續</button></div><p class="photo-note">正確選項直接取自原始編碼照片。所有選項依原照片及測試版本誘餌製作，可能含有視覺處理線索；正式研究前仍需人工審查四選一誘餌的等值性。</p>`))}
function chooseRec(i){state.recognition=i;document.querySelectorAll('.choicegrid .option').forEach((b,j)=>b.classList.toggle('selected',i===j));$('recNext').disabled=false}
async function saveTrial(){
 if(busy)return;busy=true;
 let c=state.candidates[state.recognition];state.answers.recognition_choice=state.recognition;
 state.answers.recognition_type=c.type;state.answers.recognition_correct=c.type==='target';
 state.answers.recognition_at=now();state.answers.completed_at=now();
 const chosen=state.answers.locations||Array(10).fill(null);
 const selectedIds=chosen.map((v,i)=>v!==null?i:null).filter(i=>i!==null);
 const hits=selectedIds.filter(i=>i<6).length;
 const falseAlarms=selectedIds.filter(i=>i>=6).length;
 const omissions=6-hits;
 const locationCorrectItems=Array(6).fill(null),locationErrorItems=Array(6).fill(null);
 const positionTolerancePct=9;
 for(let i=0;i<6;i++)if(chosen[i]!==null){
  const pos=chosen[i],truePoint=state.current.points[i];
  const err=Math.hypot(pos.x-truePoint.x,pos.y-truePoint.y);
  locationCorrectItems[i]=(err<=positionTolerancePct);
  locationErrorItems[i]=Math.round(err*100)/100;
 }
 const locVals=locationErrorItems.filter(x=>Number.isFinite(x));
 let swaps=0;
 for(let i=0;i<6;i++)for(let j=i+1;j<6;j++)if(chosen[i]&&chosen[j]){
  const pi=chosen[i],pj=chosen[j],ti=state.current.points[i],tj=state.current.points[j];
  if(Math.hypot(pi.x-tj.x,pi.y-tj.y)<=positionTolerancePct &&
     Math.hypot(pj.x-ti.x,pj.y-ti.y)<=positionTolerancePct)swaps++;
 }
 state.answers.scoring={
  scoring_version:'nemav-v20-free-placement-pilot',
  reconstruction_administered:true,background_recognition_administered:false,be_administered:false,
  object_hits:hits,object_false_alarms:falseAlarms,object_omissions:omissions,
  object_hit_rate:hits/6,object_false_alarm_rate:falseAlarms/4,
  object_discrimination_pr:hits/6-falseAlarms/4,
  selected_object_total:selectedIds.length,
  location_correct:locationCorrectItems.filter(v=>v===true).length,
  location_tolerance_pct:positionTolerancePct,
  location_response_mode:"continuous_percent_coordinates",
  location_correct_items:locationCorrectItems,
  location_errors_percent:locationErrorItems,
  mean_location_error_pct:locVals.length?locVals.reduce((a,b)=>a+b,0)/locVals.length:null,
  location_denominator_correctly_selected:hits,
  location_swap_pairs:swaps,
  integrated_recognition_correct:state.answers.recognition_correct,
  integrated_lure_type:state.answers.recognition_type,
  clinical_score_valid:false,recognition_lures_validated:false,object_foils_validated:false,
  empty_background_pixel_matched:false
 };
 try{await syncTrial(clone(state.answers),state.idx);state.runs.push(clone(state.answers));state.idx++;state.candidates=null;persist();runStage()}
 catch(e){alert('雲端同步未成功，請確認網路並再次按儲存：'+e.message)}finally{busy=false}
}

async function completePhase(){if(phaseMode==='immediate'){
 try{immediateEnd=await serverComplete();persist();await syncRun('immediate');showWaiting();const q=protocol()?.steps||[];const i=q.indexOf('nemav:immediate'),j=q.indexOf('nemav:delayed');if(i>=0&&j>i&&q.slice(i+1,j).includes('nvcst'))startIntervening()}
 catch(e){set(box('無法完成 NEMA-V-I',`<p>雲端儲存有問題：${e.message}。請檢查網路與 Supabase，勿清除本機進度。</p><button onclick="completePhase()">重試完成確認</button>`))}
 }else{try{await syncRun('delayed');phaseMode='finished';state.phase='done';persist();finish()}catch(e){set(box('雲端同步未完成',`<p>${e.message}</p><button onclick="completePhase()">重試同步</button>`))}}}
function finish(){state.phase='done';let summary=state.runs.map((r,i)=>`第 ${i+1} 題（${r.id}）｜正確認出物品 ${r.scoring?.object_hits??'?'}／6，誤選 ${r.scoring?.object_false_alarms??'?'}／4，正確物件位置 ${r.scoring?.location_correct??'?'}／${r.scoring?.location_denominator_correctly_selected??'?'}；整體再認：${r.recognition_correct?'正確':r.recognition_type}`).join('\n');set(box('NEMA-V 施測完成',`<p>所選場景已完成延宕測驗，逐題結果已送往 Supabase。可下載 JSON 檢查物件辨識、錯選、遺漏、位置與作答時間。</p><div class="summary">${summary}</div><div class="actions"><button onclick="exportData()">下載測試結果 JSON</button><button class="alt" onclick="resetAssessment()">建立另一個測試場次</button></div><p class="notice">v20 為未經心理計量驗證的試測原型；放置素材包含寫實透明圖與完整繪製圖（非原始照片逐像素擷取）；foils 配對與正確位置標記需進一步品質檢查，不可用於正式臨床計分。</p>`));}
function resetAssessment(){if(confirm('建立新場次會清除本裝置上的 NEMA-V 本機進度，請先匯出並確認 Supabase 資料完整。繼續嗎？')){localStorage.removeItem(PERSIST);assessment=null;immediateEnd=null;phaseMode='immediate';initial()}}
function exportData(){let data={tool:'NEMA-V prototype',version:'v20',started:state.started,assessment_id:assessment,phase:phaseMode,exported:now(),runs:state.runs,notes:'Research prototype; cloud copy in nemav_sessions, nemav_trials and test_runs; not clinically validated.'};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='NEMA_V_demo_'+new Date().toISOString().replaceAll(':','-')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
// TeleNPA cloud integration and 25-minute delayed recall. Active account/battery required.
const A=window.TeleNPAAuth;
const PERSIST='telenpa_nemav_progress_v20';
const activeBattery=()=>{try{return JSON.parse(localStorage.getItem('telenpa_battery_active_v2')||'null')}catch{return null}};
const protocol=()=>{try{return JSON.parse(localStorage.getItem('telenpa_protocol_builder_v3')||'null')}catch{return null}};
let assessment=null, immediateEnd=null, phaseMode='immediate', clinicalSync=false, busy=false;
const persist=()=>{if(assessment)localStorage.setItem(PERSIST,JSON.stringify({assessment,immediateEnd,phaseMode,state,owner:A.user()?.id,battery:activeBattery()?.id}))};
const cloud=async(path,opts={})=>A.request(path,opts);
async function insertRow(table,row){return cloud('/rest/v1/'+table,{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(row)})}
async function initAssessment(){
 const b=activeBattery();if(!A.user())throw Error('請先在首頁登入 Supabase');if(!b?.id)throw Error('請先在首頁選用受試者場次');
 assessment=crypto.randomUUID();
 await insertRow('nemav_sessions',{id:assessment,owner_id:A.user().id,battery_session_id:b.id,stimulus_order:state.order.map(x=>({scene_id:x.id,locations:x.locs,scene_set:state.sceneSet,encoding_duration_ms:10000,foil_count:4,target_count:6})),stimulus_version:'nemav-v20-free-placement-pilot'});
 persist();
}
async function syncTrial(r,index){
 const id=state.answers.cloud_id || crypto.randomUUID();
 state.answers.cloud_id=id;persist();
 await cloud('/rest/v1/nemav_trials?on_conflict=assessment_id,phase,trial_index',{
 method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},
 body:JSON.stringify({id,owner_id:A.user().id,assessment_id:assessment,phase:phaseMode,trial_index:index,scene_id:r.id,response:{...r,cloud_id:id}})});
}
async function syncRun(phase){
 state.runIds??={};state.runIds[phase]??=crypto.randomUUID();persist();
 await cloud('/rest/v1/test_runs?on_conflict=id',{
 method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},
 body:JSON.stringify({id:state.runIds[phase],owner_id:A.user().id,battery_session_id:activeBattery().id,
 test_id:'nemav',test_version:'nemav-v20-free-placement-pilot',mode:'formal',condition:phase,status:'completed',
 started_at:phase==='immediate'?state.started:immediateEnd,ended_at:new Date().toISOString(),source_record_id:assessment})});
}

async function serverComplete(){
 const result=await cloud('/rest/v1/rpc/nemav_complete_immediate',{method:'POST',body:JSON.stringify({p_assessment_id:assessment})});
 if(typeof result!=='string')throw Error('雲端未回傳起始時間');return result;
}
function delayLeft(){if(!immediateEnd)return 25*60000;return Math.max(0,Date.parse(immediateEnd)+25*60000-Date.now())}
async function showWaiting(){
 phaseMode='waiting';state.phase='waiting';persist();
 const m=Math.ceil(delayLeft()/60000),sec=Math.ceil(delayLeft()/1000);
 set(box('NEMA-V-I 已完成｜等待 NEMA-V-II',`<p>所選場景的立即階段已同步成功。延宕時間從<strong>最後一題立即回憶完成並完成雲端確認</strong>開始，由 Supabase 伺服器時間記錄。</p><h2 id="remaining">${Math.floor(sec/60)} 分 ${String(sec%60).padStart(2,'0')} 秒</h2><p class="minor">至少 25 分鐘後才能啟動 NEMA-V-II。可以離開此頁完成其他排定測驗，再返回本頁。</p><div class="actions"><button id="checkDelay" onclick="tryDelayed()" ${sec>0?'disabled':''}>檢查並開始 NEMA-V-II</button><button class="alt" onclick="location.assign('../')">返回 TeleNPA 選單</button><button class="alt" onclick="startIntervening()">執行 NVCST（如已排定）</button></div><p class="minor" id="gateState">延宕時間由雲端紀錄把關，修改裝置時間不會提前解鎖。</p>`));
}
function startIntervening(){const proto=protocol();const steps=proto?.steps||[];const i=steps.indexOf('nemav:immediate'),j=steps.indexOf('nemav:delayed');if(i<0||j<=i||!steps.slice(i+1,j).includes('nvcst')){alert('所選順序在 NEMA-V-I 與 II 之間沒有安排 NVCST；請返回選單選擇其他測驗。');return}
 const conditions=proto?.parts?.nvcst||['motor','search','maintain','switch'];location.assign('../nvcst/?conditions='+encodeURIComponent(conditions.join(','))+'&return=nemav&nemav_id='+encodeURIComponent(assessment));}
async function tryDelayed(){if(delayLeft()>0){showWaiting();return}try{busy=true;const r=await cloud('/rest/v1/nemav_sessions?select=immediate_completed_at&id=eq.'+assessment);if(!r?.[0]?.immediate_completed_at)throw Error('找不到雲端起始時間');immediateEnd=r[0].immediate_completed_at;const ready=await cloud('/rest/v1/rpc/nemav_delayed_ready',{method:'POST',body:JSON.stringify({p_assessment_id:assessment})});if(ready!==true)throw Error('Supabase 伺服器尚未確認已達 25 分鐘');phaseMode='delayed';state.idx=0;state.runs=[];state.trials=null;state.recallStage=null;persist();beginRecall()}catch(e){const el=$('gateState');if(el)el.textContent='無法啟動：'+e.message}finally{busy=false}}
setInterval(()=>{if(phaseMode==='waiting'&&$('remaining')){const sec=Math.ceil(delayLeft()/1000);$('remaining').textContent=Math.floor(sec/60)+' 分 '+String(sec%60).padStart(2,'0')+' 秒';if($('checkDelay'))$('checkDelay').disabled=sec>0}},1000);
async function resumeOrStart(){await A.restore();const saved=localStorage.getItem(PERSIST);if(saved){try{const x=JSON.parse(saved);if(x.owner===A.user()?.id&&x.battery===activeBattery()?.id){assessment=x.assessment;immediateEnd=x.immediateEnd;phaseMode=x.phaseMode;state=x.state;if(phaseMode==='waiting')return showWaiting();if(phaseMode==='finished')return finish();if(state.phase==='encode')return encode();if(state.recallStage&&Array.isArray(state.trials)){const savedPlaces=state.phase==='place'&&Array.isArray(state.places)?clone(state.places):null;activateTrial();if(savedPlaces&&savedPlaces.length===10)state.places=savedPlaces;if(state.phase==='recognize'&&state.candidates)return renderRecognize();if(state.phase==='place'&&Array.isArray(state.places))return renderPlace();return runStage()}return beginRecall() }}catch(e){console.warn(e)}}
 initial();
}
// Persist at meaningful stages; no cloud fallback that silently claims a successful save.
// Do not silently bypass research authentication when shared/auth.js is missing.
function dependencyCheck(){
 if(!window.TeleNPAAuth){
  const missing=location.protocol==='file:'
   ? '目前使用本機檔案預覽。NEMA-V 必須由 TeleNPA GitHub Pages 網站開啟，並能載入 ../shared/auth.js。'
   : '共用登入程式未載入：請確認目前網站有 shared/auth.js，且 NEMA-V 位於 nema-v/index.html。';
  throw new Error(missing);
 }
 if(typeof window.TeleNPAAuth.restore!=='function'||typeof window.TeleNPAAuth.request!=='function'||typeof window.TeleNPAAuth.user!=='function')
  throw new Error('shared/auth.js 版本不符合 NEMA-V 的需要。請使用 TeleNPA Core v4/v5 的 shared/auth.js，並重新整理網頁。');
 if(!window.CTT_CLOUD?.url||!window.CTT_CLOUD?.anonKey)
  throw new Error('無法讀取 ../config.js 的 Supabase Project URL 或 Publishable Key。請檢查網站上的 config.js。');
}
try{dependencyCheck();resumeOrStart().catch(e=>set(box('無法載入 NEMA-V',`<p>${e.message}</p><button onclick="location.assign('../')">返回首頁</button>`)))}
catch(e){set(box('NEMA-V 啟動設定錯誤',`<p>${e.message}</p><p class="minor">請從正式 TeleNPA 網站進入，勿使用裝置檔案預覽。可到 GitHub 確認 shared/auth.js、config.js、nema-v/index.html 位於同一個儲存庫根目錄。</p><button onclick="location.assign('../')">返回首頁</button>`))}

</script></body></html>
