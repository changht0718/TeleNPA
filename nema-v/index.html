async function checkStimulusAssets(){

 const status=document.getElementById('asset-status');
 const startButton=document.getElementById('begin-assessment');
 if(startButton)startButton.disabled=true;
 if(status){status.className='asset-status';status.textContent='正在檢查 96 個必要圖片資產…';}
 // Checking every file prevents discovering missing assets after saving a participant record.
 const result=await Promise.all(ASSET_NAMES.map(checkOneAsset));
 missingAssetNames=ASSET_NAMES.filter((name,i)=>!result[i]);
 verifiedAssets=missingAssetNames.length===0;
 if(status){
  status.className='asset-status '+(verifiedAssets?'ok':'error');
  status.textContent=verifiedAssets
   ? '圖片路徑檢查通過：96／96 張可載入。注意：24 張再認誘餌未經品質審查，只能進行技術試測，不得正式收案。'

}

let encodingTimeout=null,encodingToken=0;

 if(!state.seen.some(o=>o.id===sc.id))state.seen.push({id:sc.id,at:now()});
 set(box(`編碼｜畫面 ${state.idx+1}／${state.order.length}`,`<p class="minor">請專心記住圖片中的背景、六項物件及其位置。</p><div id="scene">${sceneHtml(sc,sc.locs,1,{showItems:false})}</div><p id="encode-status" role="status" class="minor">正在載入圖片…</p>`));
 const im=document.querySelector('#scene img.photo-stage');const token=encodingToken;

   if(!im.naturalWidth){const el=$('encode-status');if(el)el.textContent='圖片載入失敗，已暫停測驗。';return}

   const el=$('encode-status');if(el)el.textContent='請專心觀看圖片';
   encodingTimeout=setTimeout(()=>{if(token!==encodingToken)return;stopEncodingTimer();state.idx++;encode()},10000);
 }
 if(im.complete)ready();else{im.addEventListener('load',ready,{once:true});im.addEventListener('error',()=>{const el=$('encode-status');if(el)el.textContent='無法載入刺激圖片，請檢查 assets；不會自動跳過。'},{once:true})}
}

  stimulus_version:'v23.1-direct-reconstruction-pilot',phase:phaseMode,
  encLocs:sc.locs,object_names:sc.objs,

function renderPlace(){

function nearest(x,y){let res=0,dist=Infinity;state.sites.forEach((s,i)=>{let d=(s.x-x)**2+(s.y-y)**2;if(d<dist){dist=d;res=i}});return res}
function addAt(idx,slot,dropPoint=null){
 if(idx===null||idx<0||slot<0)return;
 const before=new Map([...document.querySelectorAll('.placed-object')].map(el=>[Number(el.dataset.placed),el.getBoundingClientRect()]));
 const prior=state.places[idx];const other=state.places.indexOf(slot);
 if(other>=0&&other!==idx)state.places[other]=prior;
 state.places[idx]=slot;
 state.selectedObj=state.places.findIndex(v=>v===null);
 if(state.selectedObj<0)state.selectedObj=null;
 persist();renderPlace();
 // Animate the object to the snapped position without resampling or blurring the bitmap.
 requestAnimationFrame(()=>{
  for(const el of document.querySelectorAll('.placed-object')){
   const id=Number(el.dataset.placed),dest=el.getBoundingClientRect();
   const origin=(id===idx&&dropPoint)?{left:dropPoint.x-dest.width/2,top:dropPoint.y-dest.height/2}:before.get(id);
   if(!origin||typeof el.animate!=='function')continue;
   const dx=origin.left-dest.left,dy=origin.top-dest.top;
   if(Math.hypot(dx,dy)<2)continue;
   el.animate([{transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`},{transform:'translate(-50%,-50%)'}],{duration:165,easing:'cubic-bezier(.22,1,.36,1)'});
  }
 });
}
function pointToSlot(clientX,clientY){
 const el=$('scene');const r=el.getBoundingClientRect();
 if(!r||clientX<r.left||clientX>r.right||clientY<r.top||clientY>r.bottom)return null;
 let x=(clientX-r.left)/r.width*100,y=(clientY-r.top)/r.height*100;
 // unchanged scene geometry; boundary adjustment has been removed
 return nearest(x,y);
}
let activeDrag=null;
function setupPlace(){
 document.querySelectorAll('.object-card,.placed-object').forEach(el=>{
  const idx=Number(el.dataset.object??el.dataset.placed);
  el.addEventListener('pointerdown',ev=>{
   if(ev.button!==0)return;
   activeDrag={id:idx,originX:ev.clientX,originY:ev.clientY,moved:false,pointerId:ev.pointerId};
   state.selectedObj=idx;
   try{el.setPointerCapture(ev.pointerId)}catch(e){}
  });
  el.addEventListener('pointermove',ev=>{
   const d=activeDrag;if(!d||d.pointerId!==ev.pointerId)return;
   if(!d.moved&&Math.hypot(ev.clientX-d.originX,ev.clientY-d.originY)>7){
    d.moved=true;
    const p=state.current.points[d.id];
    const ghost=document.createElement('div');ghost.className='drag-ghost';ghost.id='drag-ghost';
    const stage=$('scene');const r=stage.getBoundingClientRect();
    ghost.style.width=Math.max(35,Math.min(240,r.width*p.w/100))+'px';
    ghost.style.height=Math.max(35,Math.min(210,r.height*p.h/100))+'px';
    ghost.innerHTML=`<img src="${itemSprite(state.current,d.id)}" alt="">`;
    document.body.appendChild(ghost);
   }
   if(d.moved){ev.preventDefault();const ghost=$('drag-ghost');if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px'}}
  });
  el.addEventListener('pointerup',ev=>{
   const d=activeDrag;if(!d||d.pointerId!==ev.pointerId)return;
   const slot=pointToSlot(ev.clientX,ev.clientY);
   const moved=d.moved;activeDrag=null;$('drag-ghost')?.remove();
   if(moved&&slot!==null){addAt(d.id,slot,{x:ev.clientX,y:ev.clientY});return}
   state.selectedObj=d.id;renderPlace();
  });
  el.addEventListener('pointercancel',()=>{activeDrag=null;$('drag-ghost')?.remove()});
 });
 $('scene').addEventListener('click',ev=>{
  if(ev.target.closest('.placed-object'))return;
  if(activeDrag)return;
  const slot=pointToSlot(ev.clientX,ev.clientY);
  if(slot!==null&&state.selectedObj!==null)addAt(state.selectedObj,slot);
 });
}

  {type:'background',img:`assets-v23/${sc.id}_foil_background_v22.webp`,qa:'PENDING'}
 ];
 return shuffle(choices);
}

async function saveTrial(){if(busy)return;busy=true;let c=state.candidates[state.recognition];state.answers.recognition_choice=state.recognition;state.answers.recognition_type=c.type;state.answers.recognition_correct=c.type==='target';state.answers.recognition_foil_qa_passed=FOIL_QA_PASSED;state.answers.recognition_at=now();state.answers.completed_at=now();

 try{immediateEnd=await serverComplete();persist();await syncRun('immediate');showWaiting();const q=protocol()?.steps||[];const i=q.indexOf('nemav:immediate'),j=q.indexOf('nemav:delayed');if(i>=0&&j>i&&q.slice(i+1,j).includes('nvcst'))startIntervening()}

async function tryDelayed(){if(delayLeft()>0){showWaiting();return}try{busy=true;const r=await cloud('/rest/v1/nemav_sessions?select=immediate_completed_at&id=eq.'+assessment);if(!r?.[0]?.immediate_completed_at)throw Error('找不到雲端起始時間');immediateEnd=r[0].immediate_completed_at;const ready=await cloud('/rest/v1/rpc/nemav_delayed_ready',{method:'POST',body:JSON.stringify({p_assessment_id:assessment})});if(ready!==true)throw Error('Supabase 伺服器尚未確認已達 25 分鐘');phaseMode='delayed';state.idx=0;state.runs=[];persist();beginRecall()}catch(e){const el=$('gateState');if(el)el.textContent='無法啟動：'+e.message}finally{busy=false}}
setInterval(()=>{if(phaseMode==='waiting'&&$('remaining')){const sec=Math.ceil(delayLeft()/1000);$('remaining').textContent=Math.floor(sec/60)+' 分 '+String(sec%60).padStart(2,'0')+' 秒';if($('checkDelay'))$('checkDelay').disabled=sec>0}},1000);
async function resumeOrStart(){await A.restore();const saved=localStorage.getItem(PERSIST);if(saved){try{const x=JSON.parse(saved);if(x.owner===A.user()?.id&&x.battery===activeBattery()?.id){assessment=x.assessment;immediateEnd=x.immediateEnd;phaseMode=x.phaseMode;state=x.state;if(phaseMode==='waiting')return showWaiting();if(phaseMode==='finished')return finish();if(phaseMode==='delayed'){if(state.phase==='background')return recallScene();if(state.phase==='recognize'&&state.candidates)return renderRecognize();if(state.phase==='place'&&Array.isArray(state.places))return renderPlace();return recallScene()}if(phaseMode==='immediate'){if(state.phase==='encode')return encode();if(state.phase==='background')return recallScene();if(state.phase==='recognize'&&state.candidates)return renderRecognize();if(state.phase==='place'&&Array.isArray(state.places))return renderPlace();return recallScene()} }}catch(e){console.warn(e)}}
 initial();
}
// Persist at meaningful stages; no cloud fallback that silently claims a successful save.
// Do not silently bypass research authentication when shared/auth.js is missing.
function dependencyCheck(){
 if(!window.TeleNPAAuth){
  const missing=location.protocol==='file:'
   ? '目前使用本機檔案預覽。NEMA-V 必須由 TeleNPA GitHub Pages 網站開啟，並能載入 ../shared/auth.js。'
   : '共用登入程式未載入：請確認目前網站有 shared/auth.js，且 NEMA-V 位於 nema-v/index.html。';
  throw new Error(missing);
 }
 if(typeof window.TeleNPAAuth.restore!=='function'||typeof window.TeleNPAAuth.request!=='function'||typeof window.TeleNPAAuth.user!=='function')
  throw new Error('shared/auth.js 版本不符合 NEMA-V 的需要。請使用 TeleNPA Core v4/v5 的 shared/auth.js，並重新整理網頁。');
 if(!window.CTT_CLOUD?.url||!window.CTT_CLOUD?.anonKey)
  throw new Error('無法讀取 ../config.js 的 Supabase Project URL 或 Publishable Key。請檢查網站上的 config.js。');
}
try{dependencyCheck();resumeOrStart().catch(e=>set(box('無法載入 NEMA-V',`<p>${e.message}</p><button onclick="location.assign('../')">返回首頁</button>`)))}
catch(e){set(box('NEMA-V 啟動設定錯誤',`<p>${e.message}</p><p class="minor">請從正式 TeleNPA 網站進入，勿使用裝置檔案預覽。可到 GitHub 確認 shared/auth.js、config.js、nema-v/index.html 位於同一個儲存庫根目錄。</p><button onclick="location.assign('../')">返回首頁</button>`))}

</script></body></html>
