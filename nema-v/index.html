// Photo-specific scoring anchors. M2 v27 updated to the new photograph; manually approximated, not normed.
// v30: scene-wide six location anchors. The only six legal placement slots are
// the six encoded locations (0..5); no extra 6..11 distractor sites.
function sixSharedSlots(sc){return sc.points.map((p,i)=>({x:p.x,y:p.y,region:`${p.x<50?'L':'R'}${p.y<50?'T':'B'}`,canonical:i}))}

function snapPoints(sc){
 // Original six pixel-space centroids are explicitly retained as canonical locations.
 const canonical=sc.points.map((p,i)=>({x:p.x,y:p.y,canonical:i,region:`${p.x<50?'L':'R'}${p.y<50?'T':'B'}`}));
 // Six plausible DISTRACTOR positions from midpoints, never corners / photo borders.
 const order=[0,1,2,3,4,5];
 const extra=order.map((i)=>{
   const a=sc.points[i],b=sc.points[(i+2)%6];
   const x=Math.max(17,Math.min(83,a.x*.57+b.x*.43));
   const y=Math.max(21,Math.min(81,a.y*.57+b.y*.43));
   return {x,y,canonical:null,region:`${x<50?'L':'R'}${y<50?'T':'B'}`};
 });
 return [...canonical,...extra];
}

 catch(e){set(box('無法完成 NEMA-V-I',`<p>雲端儲存有問題：${e.message}。請檢查網路與 Supabase，勿清除本機進度。</p><button onclick="completePhase()">重試完成確認</button>`))}
 }else{try{await syncRun('delayed');phaseMode='finished';state.phase='done';persist();finish()}catch(e){set(box('雲端同步未完成',`<p>${e.message}</p><button onclick="completePhase()">重試同步</button>`))}}}
function finish(){state.phase='done';let summary=state.runs.map((r,i)=>`第 ${i+1} 題（${r.id}）｜六物件位置：${r.scoring?.reconstruction_administered?(r.scoring.exact_slot_match_count+'/6'):'未施測'}；再認：${r.recognition_administered===false?'未施測':(r.recognition_correct?'正確':r.recognition_type)}`).join('\n');set(box('NEMA-V 施測完成',`<p>所選場景已完成延宕重建，且每題已寫入 Supabase。可將本次測試資料下載成 JSON，檢查每個步驟的反應、時間戳與位置格位。</p><div class="summary">${summary}</div><div class="actions"><button onclick="exportData()">下載測試結果 JSON</button><button class="alt" onclick="resetAssessment()">建立另一個測試場次</button></div><p class="notice">此版保留 Supabase 與伺服器延宕控制；再認已開放試測，但影像誘餌尚未通過正式品質審查（含所有場景圖像配準），不做正式研究或臨床計分。</p>`));}
function resetAssessment(){if(confirm('建立新場次會清除本裝置上的 NEMA-V 本機進度，請先匯出並確認 Supabase 資料完整。繼續嗎？')){localStorage.removeItem(PERSIST);assessment=null;immediateEnd=null;phaseMode='immediate';initial()}}
function exportData(){let data={tool:'NEMA-V prototype',version:'v30',started:state.started,assessment_id:assessment,phase:phaseMode,exported:now(),runs:state.runs,notes:'Research prototype; cloud copy in nemav_sessions, nemav_trials and test_runs; not clinically validated.'};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='NEMA_V_demo_'+new Date().toISOString().replaceAll(':','-')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
// TeleNPA cloud integration and 25-minute delayed recall. Active account/battery required.
const A=window.TeleNPAAuth;
const PERSIST='telenpa_nemav_progress_v30';
const activeBattery=()=>{try{return JSON.parse(localStorage.getItem('telenpa_battery_active_v2')||'null')}catch{return null}};
const protocol=()=>{try{return JSON.parse(localStorage.getItem('telenpa_protocol_builder_v3')||'null')}catch{return null}};
let assessment=null, immediateEnd=null, phaseMode='immediate', clinicalSync=false, busy=false;
const persist=()=>{if(assessment)localStorage.setItem(PERSIST,JSON.stringify({assessment,immediateEnd,phaseMode,state,owner:A.user()?.id,battery:activeBattery()?.id}))};
const cloud=async(path,opts={})=>A.request(path,opts);
async function insertRow(table,row){return cloud('/rest/v1/'+table,{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(row)})}
async function initAssessment(){
 const b=activeBattery();if(!A.user())throw Error('請先在首頁登入 Supabase');if(!b?.id)throw Error('請先在首頁選用受試者場次');
 assessment=crypto.randomUUID();
 await insertRow('nemav_sessions',{id:assessment,owner_id:A.user().id,battery_session_id:b.id,stimulus_order:state.order.map(x=>({scene_id:x.id,locations:x.locs,scene_set:state.sceneSet,encoding_duration_ms:10000})),stimulus_version:'v30-six-slot-photo-pilot'});
 persist();
}
async function syncTrial(r,index){
 const id=state.answers.cloud_id || crypto.randomUUID();
 state.answers.cloud_id=id;persist();
 const saved=await cloud('/rest/v1/nemav_trials?on_conflict=assessment_id,phase,trial_index',{
 method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=representation'},
 body:JSON.stringify({id,owner_id:A.user().id,assessment_id:assessment,phase:phaseMode,trial_index:index,scene_id:r.id,response:{...r,cloud_id:id}})});
 if(Array.isArray(saved)&&saved.length===1)return;
 // A duplicate is not a fresh successful write. Fetch the row to confirm the same content was saved.
 const existing=await cloud('/rest/v1/nemav_trials?select=id,scene_id,response&assessment_id=eq.'+encodeURIComponent(assessment)+'&phase=eq.'+encodeURIComponent(phaseMode)+'&trial_index=eq.'+index);
 if(!Array.isArray(existing)||existing.length!==1||existing[0].scene_id!==r.id||
   existing[0].response?.cloud_id!==id)
  throw Error('The trial was not newly saved and the existing Supabase row does not match; please inspect before continuing');
}
async function syncRun(phase){
 state.runIds??={};state.runIds[phase]??=crypto.randomUUID();persist();
 await cloud('/rest/v1/test_runs?on_conflict=id',{
 method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},
 body:JSON.stringify({id:state.runIds[phase],owner_id:A.user().id,battery_session_id:activeBattery().id,
 test_id:'nemav',test_version:'v30-six-slot-photo-pilot',mode:'formal',condition:phase,status:'completed',
 started_at:phase==='immediate'?state.started:immediateEnd,ended_at:new Date().toISOString(),source_record_id:assessment})});
}

async function serverComplete(){
 const result=await cloud('/rest/v1/rpc/nemav_complete_immediate',{method:'POST',body:JSON.stringify({p_assessment_id:assessment})});
 if(typeof result!=='string')throw Error('雲端未回傳起始時間');return result;
}
function delayLeft(){if(!immediateEnd)return 25*60000;return Math.max(0,Date.parse(immediateEnd)+25*60000-Date.now())}
async function showWaiting(){
 phaseMode='waiting';state.phase='waiting';persist();
 const m=Math.ceil(delayLeft()/60000),sec=Math.ceil(delayLeft()/1000);
 set(box('NEMA-V-I 已完成｜等待 NEMA-V-II',`<p>立即重建與再認試測已同步成功。延宕時間從<strong>最後一題立即回憶完成並完成雲端確認</strong>開始，由 Supabase 伺服器時間記錄。</p><h2 id="remaining">${Math.floor(sec/60)} 分 ${String(sec%60).padStart(2,'0')} 秒</h2><p class="minor">至少 25 分鐘後才能啟動 NEMA-V-II。可以離開此頁完成其他排定測驗，再返回本頁。</p><div class="actions"><button id="checkDelay" onclick="tryDelayed()" ${sec>0?'disabled':''}>檢查並開始 NEMA-V-II</button><button class="alt" onclick="location.assign('../')">返回 TeleNPA 選單</button><button class="alt" onclick="startIntervening()">執行 NVCST（如已排定）</button></div><p class="minor" id="gateState">延宕時間由雲端紀錄把關，修改裝置時間不會提前解鎖。</p>`));
}
function startIntervening(){const proto=protocol();const steps=proto?.steps||[];const i=steps.indexOf('nemav:immediate'),j=steps.indexOf('nemav:delayed');if(i<0||j<=i||!steps.slice(i+1,j).includes('nvcst')){alert('所選順序在 NEMA-V-I 與 II 之間沒有安排 NVCST；請返回選單選擇其他測驗。');return}
 const conditions=proto?.parts?.nvcst||['motor','search','maintain','switch'];location.assign('../nvcst/?conditions='+encodeURIComponent(conditions.join(','))+'&return=nemav&nemav_id='+encodeURIComponent(assessment));}
async function tryDelayed(){if(delayLeft()>0){showWaiting();return}try{busy=true;const r=await cloud('/rest/v1/nemav_sessions?select=immediate_completed_at&id=eq.'+assessment);if(!r?.[0]?.immediate_completed_at)throw Error('找不到雲端起始時間');immediateEnd=r[0].immediate_completed_at;const ready=await cloud('/rest/v1/rpc/nemav_delayed_ready',{method:'POST',body:JSON.stringify({p_assessment_id:assessment})});if(ready!==true)throw Error('Supabase 伺服器尚未確認已達 25 分鐘');phaseMode='delayed';state.idx=0;state.runs=[];persist();beginRecall()}catch(e){const el=$('gateState');if(el)el.textContent='無法啟動：'+e.message}finally{busy=false}}
setInterval(()=>{if(phaseMode==='waiting'&&$('remaining')){const sec=Math.ceil(delayLeft()/1000);$('remaining').textContent=Math.floor(sec/60)+' 分 '+String(sec%60).padStart(2,'0')+' 秒';if($('checkDelay'))$('checkDelay').disabled=sec>0}},1000);
async function resumeOrStart(){await A.restore();const saved=localStorage.getItem(PERSIST);if(saved){try{const x=JSON.parse(saved);if(x.owner===A.user()?.id&&x.battery===activeBattery()?.id){assessment=x.assessment;immediateEnd=x.immediateEnd;phaseMode=x.phaseMode;state=x.state;if(phaseMode==='waiting')return showWaiting();if(phaseMode==='finished')return finish();if(phaseMode==='delayed'){if(state.phase==='background')return recallScene();if(state.phase==='recognize')return renderRecognize();if(state.phase==='place'&&Array.isArray(state.places))return renderPlace();return recallScene()}if(phaseMode==='immediate'){if(state.phase==='encode')return encode();if(state.phase==='background')return recallScene();if(state.phase==='recognize')return renderRecognize();if(state.phase==='place'&&Array.isArray(state.places))return renderPlace();return recallScene()} }}catch(e){console.warn(e)}}
 initial();
}
// Persist at meaningful stages; no cloud fallback that silently claims a successful save.
// Do not silently bypass research authentication when shared/auth.js is missing.
function dependencyCheck(){
 if(!window.TeleNPAAuth){
  const missing=location.protocol==='file:'
   ? '目前使用本機檔案預覽。NEMA-V 必須由 TeleNPA GitHub Pages 網站開啟，並能載入 ../shared/auth.js。'
   : '共用登入程式未載入：請確認目前網站有 shared/auth.js，且 NEMA-V 位於 nema-v/index.html。';
  throw new Error(missing);
 }
 if(typeof window.TeleNPAAuth.restore!=='function'||typeof window.TeleNPAAuth.request!=='function'||typeof window.TeleNPAAuth.user!=='function')
  throw new Error('shared/auth.js 版本不符合 NEMA-V 的需要。請使用 TeleNPA Core v4/v5 的 shared/auth.js，並重新整理網頁。');
 if(!window.CTT_CLOUD?.url||!window.CTT_CLOUD?.anonKey)
  throw new Error('無法讀取 ../config.js 的 Supabase Project URL 或 Publishable Key。請檢查網站上的 config.js。');
}
try{dependencyCheck();resumeOrStart().catch(e=>set(box('無法載入 NEMA-V',`<p>${e.message}</p><button onclick="location.assign('../')">返回首頁</button>`)))}
catch(e){set(box('NEMA-V 啟動設定錯誤',`<p>${e.message}</p><p class="minor">請從正式 TeleNPA 網站進入，勿使用裝置檔案預覽。可到 GitHub 確認 shared/auth.js、config.js、nema-v/index.html 位於同一個儲存庫根目錄。</p><button onclick="location.assign('../')">返回首頁</button>`))}

</script></body></html>
